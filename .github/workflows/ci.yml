name: CI

# Only files nothing builds or reads. Other .md files stay in: src/electron ships some.
on:
  pull_request:
    paths-ignore: &docs-only
      - "docs/**"
      - "README*.md"
      - "CLAUDE.md"
  push:
    branches: [master]
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A job takes ~5 min; a hung Electron test should fail fast, not hold the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS arm64 runners are scarce and jobs can queue for them, so anything
      # that does not start Electron runs on Linux. jobs is how many suites run at
      # once: Electron suites mostly wait, and the Linux ones have 4 cores.
      matrix:
        include:
          - { name: "Test (macOS, shard 1/3)", os: macos-15, group: macos, shard: 1/3, jobs: 2 }
          - { name: "Test (macOS, shard 2/3)", os: macos-15, group: macos, shard: 2/3, jobs: 2 }
          - { name: "Test (macOS, shard 3/3)", os: macos-15, group: macos, shard: 3/3, jobs: 2 }
          - { name: "Test & Build (Linux)", os: ubuntu-latest, group: linux, shard: "", jobs: 4 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Python for node-gyp
        shell: bash
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          AEGIS_TEST_GROUP: ${{ matrix.group }}
          AEGIS_TEST_SHARD: ${{ matrix.shard }}
          AEGIS_TEST_JOBS: ${{ matrix.jobs }}

      # Only one job needs this.
      - name: Build (Vite + TS)
        if: matrix.group == 'linux'
        run: npm run build
