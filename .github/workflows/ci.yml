name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (macOS, shard ${{ matrix.shard }}/3)
    runs-on: macos-15
    # A shard takes ~8 min; a hung Electron test should fail fast, not hold the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Python for node-gyp
        shell: bash
        run: |
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          AEGIS_TEST_SHARD: ${{ matrix.shard }}/3

      # Only one shard needs this; scripts/run-tests.mjs gives it fewer suites to match.
      - name: Build (Vite + TS)
        if: matrix.shard == 1
        run: npm run build
